name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify the standalone builder
        run: python3 -m unittest discover -s scripts -p test_build_docs.py
      - name: Build the HTML publication
        run: python3 scripts/build_docs.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the HTML publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
